<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>ببلو کھاتا</title>
<style>
@font-face{font-family:'NotoUrdu';src:url('https://fonts.gstatic.com/s/notonastaliqurdu/v22/LhWNMUPbKoeKZNGMoiLfN4-DlmNIAeHnpA.woff2') format('woff2');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(160deg,#eef4f3,#ddeee9);color:#1f2937;font:700 18px/2.2 'NotoUrdu','Noto Nastaliq Urdu','Noto Naskh Arabic',serif;min-height:100vh}
button,input{font:inherit}
a{color:inherit;text-decoration:none}
.page{min-height:100vh;padding-bottom:140px}
.anim{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);background:#fef9c3}60%{transform:scale(1.04)}100%{transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes fadeo{from{opacity:0}}
@keyframes slide{from{transform:translateY(100%)}}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shine{0%{transform:translateX(-160%) rotate(20deg)}60%,100%{transform:translateX(160%) rotate(20deg)}}
@keyframes redalert{0%,100%{background:#fff}50%{background:#fff0f0}}

/* ہیڈر */
.top{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:14px 16px 18px;border-radius:0 0 28px 28px;box-shadow:0 6px 20px #0f766e44}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row>.btn{width:auto;flex:1}
.row>.in{flex:1;min-width:0}
.ib{background:#ffffff30;border:0;color:#fff;border-radius:14px;padding:2px 10px;font-size:20px;line-height:1.8;cursor:pointer}
.ib small{display:block;font-size:11px;line-height:1.9}
.ib:active{opacity:.7}
.tot{text-align:center;margin-top:6px;line-height:1.8}
.amt{font-size:42px;line-height:1.4}

/* فارم */
.wrap{padding:14px}
.in{width:100%;border:2px solid #cbd5e1;border-radius:16px;padding:6px 14px;font-size:20px;line-height:2;background:#fff;margin:6px 0;text-align:right;outline:0;transition:border .2s,box-shadow .2s}
.in:focus{border-color:#14b8a6;box-shadow:0 0 0 4px #14b8a622}

/* بٹن */
.btn{display:block;width:100%;border:0;border-radius:18px;padding:6px 10px;font-size:21px;line-height:2;color:#fff;background:#0f766e;box-shadow:0 4px 0 #0a5a54;transition:transform .12s,box-shadow .12s;margin:8px 0;cursor:pointer}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:none}
.btn.red{background:#dc2626;box-shadow:0 4px 0 #a31b1b}
.btn.grn{background:#16a34a;box-shadow:0 4px 0 #0f7a36}
.btn.org{background:#ea580c;box-shadow:0 4px 0 #c2410c}
.btn.lite{background:#e2e8f0;color:#1f2937;box-shadow:0 4px 0 #cbd5e1}
.btn.busy{opacity:.6;pointer-events:none}
.fix{position:fixed;bottom:0;left:0;right:0;padding:10px 14px 16px;background:linear-gradient(transparent,#ddeee9 38%)}

/* کارڈ */
.card{background:#fff;border-radius:20px;padding:6px 16px;margin:10px 0;box-shadow:0 2px 12px #0001;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card.col{flex-direction:column;align-items:stretch}
.anim .card{animation:up .4s both;animation-delay:var(--d,0s)}
.cust{transition:transform .15s;cursor:pointer}
.cust:active{transform:scale(.97)}
.nm{font-size:21px}
.bl{font-size:24px;text-align:left;line-height:1.6}
.bl small{display:block;font-size:13px;line-height:1.9}
.r{color:#dc2626}.g{color:#16a34a}

/* لال الرٹ */
.alert-card{animation:redalert 1.5s ease infinite;border:2px solid #fca5a5}
.alert-badge{background:#dc2626;color:#fff;border-radius:20px;padding:1px 10px;font-size:12px;display:inline-block;margin-right:6px}

/* انٹری */
.ent{border-right:8px solid}
.ent.rd{border-color:#dc2626}.ent.gr{border-color:#16a34a}
.ent.new{animation:pop .6s}
.ea{font-size:21px}
.del{background:#fee2e2;border:0;border-radius:14px;font-size:22px;padding:4px 12px;cursor:pointer}

/* عام */
.empty{text-align:center;color:#64748b;padding:40px 10px}
.c{text-align:center}
.sub{margin:0;color:#64748b}
.warn{background:#fee2e2;border-radius:14px;padding:4px 12px;color:#b91c1c;margin:8px 0}
.er{color:#dc2626;text-align:center;min-height:36px}
.lnk{background:none;border:0;color:#0f766e;font-size:18px;text-decoration:underline;display:block;margin:4px auto;cursor:pointer}

/* شیٹ */
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9;animation:fadeo .2s}
#calc .ov{z-index:20}
.box{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:12px 16px 24px;animation:slide .3s ease;max-height:92vh;overflow:auto}
.box h2{margin:4px 0;font-size:21px}

/* مائک */
.mic{background:#e0f2fe;border:0;border-radius:16px;font-size:22px;padding:4px 12px;line-height:1.9;flex:none;cursor:pointer}
.mic:active{transform:scale(.92)}
.mic.on{animation:pulse 1s infinite;background:#fecaca}

/* بول بٹن */
.spk{background:#f0fdf4;border:0;border-radius:14px;font-size:20px;padding:3px 10px;line-height:1.9;cursor:pointer;border:1px solid #bbf7d0}
.spk:active{transform:scale(.92)}

/* ادائیگی */
.pay{background:#fff;border-radius:20px;padding:8px 16px;margin:10px 0;box-shadow:0 2px 10px #0001}
.pn{font-size:28px;letter-spacing:1px;display:block;direction:ltr;text-align:right}
.st{display:flex;gap:8px;margin-top:10px}
.st div{flex:1;background:#ffffff30;border-radius:16px;text-align:center;padding:2px;font-size:13px;line-height:2}
.st b{display:block;font-size:26px;line-height:1.6}

/* ٹوسٹ */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:4px 20px;border-radius:30px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;line-height:2;font-size:17px}
#toast.on{opacity:1}

/* نیچے فوٹر */
.footer{text-align:center;padding:16px 10px 8px;color:#64748b;font-size:14px;line-height:2.2;border-top:1px solid #e2e8f0;margin-top:20px}
.footer b{color:#0f766e;font-size:17px}
.footer a{color:#0f766e}

/* 3D لوگو */
.stage{perspective:800px;height:180px;display:flex;justify-content:center;align-items:center;margin-top:10px}
.stage.bump{animation:bump .7s ease}
.coin{position:relative;width:140px;height:140px;transform-style:preserve-3d;animation:spin 8s linear infinite}
.e{position:absolute;inset:0;border-radius:50%;background:#a16207}
.f{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#14532d;padding:16px;line-height:1.8;
 background:radial-gradient(circle at 30% 28%,#fef3c7,#fbbf24 50%,#b45309);box-shadow:inset 0 0 0 5px #fbbf24,inset 0 0 0 8px #92400e}
.f small{font-size:11px;line-height:1.6;opacity:.8}
.f::after{content:"";position:absolute;top:-20%;bottom:-20%;width:28%;left:36%;background:linear-gradient(90deg,transparent,#ffffff88,transparent);animation:shine 4s ease-in-out infinite}
.fr{transform:translateZ(8px)}
.bk{transform:rotateY(180deg) translateZ(8px)}
.nb{display:flex;justify-content:center;gap:14px;margin:2px 0 6px}

/* چھوٹا لوگو اندر */
.mini-coin{display:inline-block;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fef3c7,#fbbf24 50%,#b45309);box-shadow:inset 0 0 0 3px #92400e;vertical-align:middle;margin-left:8px;animation:spin 8s linear infinite;transform-style:preserve-3d}

/* انسٹال بٹن */
#installBtn{display:none;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:0;border-radius:18px;padding:8px 20px;font-size:19px;line-height:2;width:100%;margin:8px 0;cursor:pointer;box-shadow:0 4px 0 #b45309}
#installBtn:active{transform:translateY(4px);box-shadow:none}

/* کیلکولیٹر */
.cd{background:#0f172a;color:#fff;border-radius:16px;padding:4px 16px;font-size:32px;line-height:1.9;text-align:left;direction:ltr;min-height:64px;overflow:hidden;word-break:break-all}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;direction:ltr}
.kp button{border:0;border-radius:14px;background:#e2e8f0;font-size:24px;padding:2px 0;line-height:1.9;color:#1f2937;box-shadow:0 3px 0 #cbd5e1;transition:transform .1s;cursor:pointer}
.kp button:active{transform:scale(.92)}
.kp .op{background:#ccfbf1;color:#0f766e}
.kp .cl{background:#fee2e2;color:#b91c1c}
.kp .eq{background:#0f766e;color:#fff}
.kp .w2{grid-column:span 2}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="calc"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyCFW0RgqKYr4oqPkzXN12Fi3vasAXdVBoA",
  authDomain:"bablu-khata.firebaseapp.com",
  projectId:"bablu-khata",
  storageBucket:"bablu-khata.firebasestorage.app",
  messagingSenderId:"123920071236",
  appId:"1:123920071236:web:636866ce33cb0c7dcdda11"
});

const auth=firebase.auth(),db=firebase.firestore(),FV=firebase.firestore.FieldValue,TSP=firebase.firestore.Timestamp;
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

// ثابت چیزیں
const ADMIN='admin@bablu.app';
const DAY=864e5;
const PAY_NUM='03012207137';    // پیسے بھیجنے کا نمبر
const WA_NUM='03480329691';     // واٹس ایپ رابطہ نمبر
const APP_NAME='ببلو کھاتا';
const ALERT_DAYS=15;            // لال الرٹ کے دن

let uid,me,custs=[],ents=[],users=[],unsubs=[],view={n:'list'},q='',authMode='login',cb,showFee=false,first=true;
let base=JSON.parse(localStorage.getItem('bt')||'null');
let deferredInstall=null;

// انسٹال پرامٹ پکڑیں
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredInstall=e;
  const b=document.getElementById('installBtn');
  if(b)b.style.display='block'});

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const en=s=>String(s||'').replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
const num=n=>Math.round(n).toLocaleString('en-US');
const fmt=t=>{if(!t)return'';const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
const mail=(p,v)=>p+(v>1?'v'+v:'')+'@bablu.app';
const focus=id=>setTimeout(()=>{const e=$('#'+id);e&&e.focus()},350);
const daysDiff=(ts)=>Math.floor((Date.now()-ts)/DAY);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function sheet(h){$('#sheet').innerHTML='<div class="ov" onclick="if(event.target==this)closeSheet()"><div class="box">'+h+'</div></div>'}
function closeSheet(){$('#sheet').innerHTML=''}
function ask(msg,yes,fn,cls){cb=fn;sheet(`<h2 class="c">${msg}</h2><button class="btn ${cls||'red'}" onclick="closeSheet();cb()">${yes}</button><button class="btn lite" onclick="closeSheet()">❌ نہیں، رہنے دیں</button>`)}
function er(m){const e=$('#er');if(e)e.textContent=m}
function busy(b){const g=$('#go');if(g)g.classList.toggle('busy',!!b)}
function em(e){const c=e.code||'';
  if(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(c))return 'پن غلط ہے';
  if(/network|unavailable/.test(c))return 'انٹرنیٹ نہیں ہے';
  if(c.includes('too-many'))return 'بہت کوششیں ہو گئیں۔ تھوڑی دیر بعد کریں';
  if(c.includes('permission'))return 'اجازت نہیں ہے';
  return 'کچھ گڑبڑ ہو گئی'}

// فوٹر HTML
function footerHTML(){
  return `<div class="footer">
    <b>📒 ${APP_NAME}</b><br>
    واٹس ایپ: <a href="https://wa.me/92${WA_NUM.slice(1)}">${WA_NUM}</a><br>
    <small>آپ کا ڈیجیٹل حساب کتاب</small>
  </div>`}

// انسٹال بٹن
async function installApp(){
  if(!deferredInstall)return toast('ایپ پہلے سے انسٹال ہے یا انسٹال نہیں ہو سکتی');
  deferredInstall.prompt();
  const r=await deferredInstall.userChoice;
  if(r.outcome==='accepted')toast('✅ ایپ انسٹال ہو گئی!');
  deferredInstall=null}

// بول کر بتاؤ (Text-to-Speech)
function speak(text){
  if(!window.speechSynthesis)return toast('یہ فون آواز نہیں دے سکتا');
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ur-PK';u.rate=0.9;u.pitch=1;
  window.speechSynthesis.speak(u)}

// مائک
let rec=null;
function mic(btn,fn){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return toast('اس فون میں مائک نہیں چلتا');
  if(rec){try{rec.stop()}catch(x){}rec=null;return}
  const r=new R();r.lang='ur-PK';rec=r;
  r.onresult=e=>fn(e.results[0][0].transcript);
  r.onend=()=>{if(btn)btn.classList.remove('on');rec=null};
  r.onerror=e=>{if(btn)btn.classList.remove('on');rec=null;
    toast(e.error=='network'?'مائک کو انٹرنیٹ چاہیے':e.error=='not-allowed'?'مائک کی اجازت دیں':'آواز سمجھ نہیں آئی')};
  if(btn)btn.classList.add('on');toast('🎤 بولیں...');
  try{r.start()}catch(x){if(btn)btn.classList.remove('on');rec=null}}

// آواز سے گاہک تلاش
function voiceSearch(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return toast('اس فون میں مائک نہیں چلتا');
  const r=new R();r.lang='ur-PK';
  r.onresult=e=>{
    const t=e.results[0][0].transcript.trim();
    q=t;
    const inp=$('#srch');if(inp)inp.value=t;
    const cl=$('#cl');if(cl)cl.innerHTML=cl_html()};
  r.onerror=()=>toast('آواز سمجھ نہیں آئی');
  r.start();toast('🎤 گاہک کا نام بولیں...')}

function fill(id,t,numeric){
  const i=$('#'+id);if(!i)return;
  if(numeric){const d=en(t).replace(/[^\d]/g,'');if(d)i.value=d;else toast('رقم سمجھ نہیں آئی، دوبارہ بولیں')}
  else i.value+=(i.value?' ':'')+t.replace(/[.۔]+$/,'')}

// کیلکولیٹر
let cx='';
const KEYS=[['C','cl'],['⌫','op'],['÷','op'],['×','op'],['7'],['8'],['9'],['−','op'],['4'],['5'],['6'],['+','op'],['1'],['2'],['3'],['=','eq'],['0','w2'],['00'],['.']];
function calc(){cx='';
  $('#calc').innerHTML=`<div class="ov" onclick="if(event.target==this)closeCalc()"><div class="box">
  <h2 class="c">🧮 کیلکولیٹر</h2>
  <div class="cd" id="cd">0</div>
  <div class="kp">${KEYS.map(k=>`<button class="${k[1]||''}" onclick="key('${k[0]}')">${k[0]}</button>`).join('')}</div>
  <button class="btn grn" onclick="useCalc()">✅ رقم میں ڈالیں</button>
  <button class="btn lite" onclick="closeCalc()">❌ بند کریں</button></div></div>`}
function closeCalc(){$('#calc').innerHTML=''}
function cshow(){$('#cd').textContent=cx||'0'}
function cval(){
  const s=cx.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[+\-*/.]+$/,'');
  if(!s||!/^[\d+\-*/. ]+$/.test(s))return null;
  try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?Math.round(v*100)/100:null}catch(e){return null}}
function key(k){
  const ops='+−×÷';
  if(k=='C')cx='';
  else if(k=='⌫')cx=cx.slice(0,-1);
  else if(k=='='){const v=cval();if(v!==null)cx=String(v)}
  else if(ops.includes(k)){if(!cx)return;if(ops.includes(cx.slice(-1)))cx=cx.slice(0,-1);cx+=k}
  else if(k=='00'){if(!cx||ops.includes(cx.slice(-1)))return;cx+='00'}
  else cx+=k;
  cshow()}
function useCalc(){
  const v=cval();
  if(v===null||v<=0)return toast('پہلے حساب لگائیں');
  const i=$('#am');if(i)i.value=Math.round(v);
  closeCalc();toast('✅ رقم ڈال دی')}

// 3D لوگو
function DEF_NAME(){return'ببلو کھاتا'}
function lname(){return localStorage.getItem('lname')||DEF_NAME()}
function coinHTML(){
  const n=lname(),l=n.length,fs=l<=6?30:l<=10?24:19,sub=n!=DEF_NAME()?'<small>ببلو کھاتا</small>':'';
  const face=`<b style="font-size:${fs}px">${esc(n)}</b>${sub}`;
  return `<div class="coin">${[-6,-4,-2,0,2,4,6].map(z=>`<div class="e" style="transform:translateZ(${z}px)"></div>`).join('')}<div class="f fr">${face}</div><div class="f bk">${face}</div></div>`}
function setName(n){
  n=String(n||'').replace(/[.۔]+$/,'').trim().slice(0,16);
  if(!n)return toast('نام لکھیں');
  localStorage.setItem('lname',n);
  const s=$('#stage');
  if(s){s.innerHTML=coinHTML();s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
  toast('✅ نام لگ گیا')}
function nameSheet(){
  sheet(`<h2 class="c">✏️ لوگو پر نام لکھیں</h2>
  <input id="lnm" class="in" maxlength="16" value="${esc(lname())}">
  <button class="btn" onclick="setName($('#lnm').value);closeSheet()">✅ لگائیں</button>
  <button class="btn lite" onclick="closeSheet()">❌ بند کریں</button>`);focus('lnm')}

// Firebase وقت
function sNow(){if(!base)return Date.now();return base.s+Math.max(Date.now()-base.l,0)}
function expired(){return !me||!me.paidUntil||me.paidUntil.toMillis()<sNow()}
async function sync(){
  try{
    const r=db.doc('users/'+uid);
    const job=r.update({lastSeen:FV.serverTimestamp()}).then(()=>r.get({source:'server'}));
    const s=await Promise.race([job,new Promise((_,j)=>setTimeout(j,8000))]);
    const t=s.data()&&s.data().lastSeen;
    if(t){base={s:t.toMillis(),l:Date.now()};localStorage.setItem('bt',JSON.stringify(base));render(false)}
  }catch(e){}}

// لاگ ان صفحہ
function authHTML(){
  const m=authMode;
  return `<div class="page anim c">
  <div class="stage" id="stage">${coinHTML()}</div>
  <div class="nb">
    <button class="mic" onclick="mic(this,setName)">🎤</button>
    <button class="mic" onclick="nameSheet()">✏️</button>
  </div>
  <p class="sub">${m=='login'?'اپنا کھاتا کھولیں':m=='new'?'نیا کھاتا بنائیں':'نیا پن بنائیں'}</p>
  <div class="wrap">
  ${m=='reset'?'<div class="warn">⚠️ پرانا سارا ڈیٹا ختم ہو جائے گا</div>':''}
  ${m!='login'?`<input id="nm" class="in" maxlength="30" placeholder="آپ کا نام">`:''}
  <input id="ph" class="in" type="tel" inputmode="numeric" maxlength="11" placeholder="موبائل نمبر (03001234567)">
  <input id="pn" class="in" type="tel" inputmode="numeric" maxlength="6" style="-webkit-text-security:disc" placeholder="${m=='login'?'پن (6 ہندسے)':'نیا پن (6 ہندسے)'}">
  <div id="er" class="er"></div>

function setMode(m){authMode=m;$('#app').innerHTML=authHTML();if(deferredInstall){const b=$('#installBtn');if(b)b.style.display='block'}}

function vals(){return{ph:en($('#ph').value||'').trim(),pn:en($('#pn').value||'').trim(),nm:$('#nm')?$('#nm').value.trim():''}}
function check(v,needName){
  if(needName&&!v.nm){er('اپنا نام لکھیں');return 0}
  if(!/^03\d{9}$/.test(v.ph)){er('موبائل نمبر 11 ہندسوں کا لکھیں');return 0}
  if(!/^\d{6}$/.test(v.pn)){er('پن 6 ہندسوں کا لکھیں');return 0}
  return 1}

async function login(){
  const v=vals();if(!check(v,0))return;er('');busy(1);
  try{
    const d=await db.doc('phones/'+v.ph).get();
    if(!d.exists){busy(0);return er('اس نمبر کا کھاتا نہیں ہے')}
    await auth.signInWithEmailAndPassword(mail(v.ph,d.data().v),v.pn);
  }catch(e){busy(0);er(em(e))}}

async function signup(reset){
  const v=vals();if(!check(v,1))return;er('');busy(1);
  try{
    const d=await db.doc('phones/'+v.ph).get();let ver=1;
    if(d.exists){
      if(!reset){busy(0);return er('یہ نمبر پہلے سے ہے۔ پن بھول گئے ہوں تو "پن بھول گئے" دبائیں')}
      ver=d.data().v+1;
    }else if(reset){busy(0);return er('اس نمبر کا کوئی کھاتا نہیں ہے')}
    const c=await auth.createUserWithEmailAndPassword(mail(v.ph,ver),v.pn);
    const u=c.user.uid;
    await db.doc('users/'+u).set({name:v.nm,phone:v.ph,createdAt:FV.serverTimestamp(),paidUntil:TSP.fromMillis(Date.now()+30*DAY),lastSeen:FV.serverTimestamp()});
    await db.doc('phones/'+v.ph).set({v:ver,uid:u});
  }catch(e){busy(0);er(em(e))}}

function logout(){ask('باہر نکلنا ہے؟','🚪 ہاں، باہر',()=>auth.signOut(),'lite')}

// حساب
function balMap(){const m={};ents.forEach(e=>{if(!e.del)m[e.cid]=(m[e.cid]||0)+(e.type=='d'?e.amt:-e.amt)});return m}

// آخری ادھار کب ہوا
function lastUdharDays(cid){
  const es=ents.filter(e=>e.cid==cid&&!e.del&&e.type=='d');
  if(!es.length)return -1;
  const last=Math.max(...es.map(e=>e.ts));
  return daysDiff(last)}

function go(v){view=v;closeSheet();render(true);scrollTo(0,0)}
function counts(){
  document.querySelectorAll('.amt[data-v]').forEach(el=>{
    const v=+el.dataset.v;if(!v)return;const t0=performance.now();
    (function f(t){const p=Math.min((t-t0)/550,1);el.textContent=num(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}

function render(anim){
  const a=$('#app');
  if(!me){a.innerHTML='<div class="page c" style="padding-top:60px"><div style="font-size:70px;animation:float 3s ease-in-out infinite">📒</div><h2>⏳ کھل رہا ہے...</h2></div>';return}
  if(expired()){showFee=true;closeSheet();a.innerHTML=feeHTML();return}
  showFee=false;
  a.innerHTML=view.n=='cust'?custHTML(anim):view.n=='trash'?trashHTML(anim):listHTML(anim);
  if(anim)counts()}

function cl_html(){
  const bs=balMap(),all=custs.filter(c=>!c.del);
  const l=all.filter(c=>c.name.includes(q.trim())).sort((a,b)=>(bs[b.id]||0)-(bs[a.id]||0)||a.name.localeCompare(b.name));
  if(!l.length)return `<div class="empty">${all.length?'کوئی نہیں ملا':'ابھی کوئی گاہک نہیں<br>نیچے بٹن سے شامل کریں'}</div>`;

function purge(){
  const n=Date.now(),P='users/'+uid,b=db.batch();let c=0;
  ents.forEach(e=>{if(c<400&&(e.ts<n-183*DAY||(e.del&&e.delAt&&n-e.delAt>30*DAY))){b.delete(db.doc(P+'/entries/'+e.id));c++}});
  custs.forEach(x=>{if(c<400&&x.del&&x.delAt&&n-x.delAt>30*DAY){b.delete(db.doc(P+'/customers/'+x.id));c++;
    ents.filter(e=>e.cid==x.id).forEach(e=>{if(c<450){b.delete(db.doc(P+'/entries/'+e.id));c++}})}});
  if(c)b.commit().catch(()=>{})}

  <div class="wrap">
    ${l.map((u,i)=>`<div class="card col" style="--d:${Math.min(i,8)*.05}s">
      <div class="row">
        <div>
          <div class="nm">👤 ${esc(u.name)}</div>
          <a href="tel:${esc(u.phone)}" dir="ltr" style="text-align:right;font-size:18px">📞 ${esc(u.phone)}</a>
          <div><small>📅 ${fmt(cm(u))} — ${ex(u)?'🔴 بند':'🟢 کھلا ('+Math.ceil((pu(u)-n)/DAY)+' دن باقی)'}</small></div>
        </div>
      </div>
      <button class="btn ${ex(u)?'grn':'red'}" onclick="tog('${u.id}',${ex(u)})">${ex(u)?'🟢 کھاتہ کھولیں (30 دن)':'🔴 کھاتہ بند کریں'}</button>
    </div>`).join('')||'<div class="empty">ابھی کوئی دکاندار نہیں</div>'}
  </div>
  ${footerHTML()}
  </div>`;
  adminAnim=false}

function tog(id,open){
  ask(open?'یہ کھاتہ 30 دن کے لیے کھولیں؟':'یہ کھاتہ بند کریں؟',
    open?'🟢 ہاں، کھولیں':'🔴 ہاں، بند کریں',
    ()=>db.doc('users/'+id).update({paidUntil:TSP.fromMillis(open?Date.now()+30*DAY:Date.now()-1000)}),
    open?'grn':'red')}

// شروع
function userStart(u){
  uid=u.uid;custs=[];ents=[];view={n:'list'};q='';first=true;me=null;render();
  const P='users/'+uid;
  unsubs=[
    db.doc(P).onSnapshot(s=>{me=s.data()||null;render(first&&!!me);if(me)first=false}),
    db.collection(P+'/customers').onSnapshot(s=>{custs=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)}),
    db.collection(P+'/entries').onSnapshot(s=>{ents=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)})
  ];
  sync();setTimeout(purge,6000)}

auth.onAuthStateChanged(u=>{
  unsubs.forEach(f=>f());unsubs=[];me=null;uid=null;closeSheet();closeCalc();
  // ایڈمن: صرف #admin والے لنک پر
  if(location.hash=='#admin'){
    if(u&&u.email==ADMIN){adminAnim=true;adminStart();return}
    $('#app').innerHTML=adminLoginHTML();return}
  // دکاندار: باقی سب لنک
  if(u&&u.email==ADMIN){auth.signOut();return} // ایڈمن غلطی سے دکاندار لنک کھولے
  if(!u){authMode='login';$('#app').innerHTML=authHTML();if(deferredInstall){const b=$('#installBtn');if(b)b.style.display='block'}return}
  userStart(u)});

addEventListener('hashchange',()=>location.reload());
setInterval(()=>{if(me&&uid&&expired()!=showFee)render(false)},30000);
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
