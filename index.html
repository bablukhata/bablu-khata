<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b3b37">
<title>ایڈمن</title>
<style>
@font-face{font-family:U;src:local('Noto Nastaliq Urdu'),local('Jameel Noori Nastaleeq'),url('urdu.woff2') format('woff2');font-display:swap}
:root{--d:#0b3b37;--g:#0f766e;--g2:#14b8a6;--br:#fbbf24;--br2:#92400e;--bg:#eef4f3;--r:#dc2626;--ok:#16a34a;--tx:#1f2937;--mu:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:700 17px/2.2 U,'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.c{text-align:center}

/* قفل والی اسکرین */
.gate{min-height:100vh;background:radial-gradient(circle at 50% 18%,#115e57,var(--d) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.lock{filter:drop-shadow(0 12px 22px #0008);animation:fl 4s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:100% 100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.open .sh{transform:translateY(-16px) rotate(-32deg)}
.open .lock{animation:none}
.shake{animation:sk .4s}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.gate h1{margin:6px 0 0;font-size:24px}
.gate p{margin:0;opacity:.7;font-size:15px}
.pw{width:100%;max-width:340px;margin:14px 0 6px;padding:4px 16px;border:2px solid #ffffff40;border-radius:16px;background:#ffffff14;color:#fff;font-size:20px;line-height:2;text-align:center;direction:ltr;outline:0;-webkit-text-security:disc;transition:border .2s}
.pw:focus{border-color:var(--br)}
.go{width:100%;max-width:340px;border:0;border-radius:16px;padding:4px;font-size:20px;line-height:2.2;background:var(--br);color:var(--br2);box-shadow:0 4px 0 #b45309;transition:transform .1s}
.go:active{transform:translateY(4px);box-shadow:none}
.go[disabled]{opacity:.6}
.er{min-height:34px;color:#fecaca;font-size:15px}

/* ڈیش بورڈ */
.top{background:linear-gradient(135deg,var(--d),var(--g));color:#fff;padding:14px 16px 20px;border-radius:0 0 28px 28px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.out{background:#ffffff26;border:0;color:#fff;border-radius:14px;padding:0 14px;font-size:16px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.st div{background:#ffffff1f;border-radius:14px;text-align:center;font-size:12px;line-height:1.8;padding:6px 2px}
.st b{display:block;font-size:24px;line-height:1.4}
.wrap{padding:12px 14px 40px;max-width:640px;margin:0 auto}
.q{width:100%;border:2px solid #cbd5e1;border-radius:16px;padding:2px 14px;font-size:18px;line-height:2.1;background:#fff;outline:0;margin-bottom:8px}
.q:focus{border-color:var(--g2)}
.shop{background:#fff;border-radius:18px;padding:6px 16px 10px;margin:10px 0;border-right:8px solid var(--ok);box-shadow:0 2px 10px #0001;animation:in .35s both;animation-delay:var(--d,0s)}
.shop.off{border-color:var(--r)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.nm{font-size:20px}
.ph{color:var(--g);direction:ltr;display:inline-block;text-decoration:none}
.mu{color:var(--mu);font-size:14px;line-height:2}
.tag{display:inline-block;border-radius:12px;padding:0 10px;font-size:13px;line-height:1.9;margin-right:6px;color:#fff;background:var(--ok)}
.off .tag{background:var(--r)}
.bt{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.b{flex:1;min-width:120px;border:0;border-radius:14px;padding:0 10px;font-size:16px;line-height:2.2;color:#fff;background:var(--ok);box-shadow:0 3px 0 #0f7a36;transition:transform .1s}
.b:active{transform:translateY(3px);box-shadow:none}
.b.r{background:var(--r);box-shadow:0 3px 0 #a31b1b}
.b.o{background:#ea580c;box-shadow:0 3px 0 #c2410c}
.b.l{background:#e2e8f0;color:var(--tx);box-shadow:0 3px 0 #cbd5e1}
.empty{text-align:center;color:var(--mu);padding:36px 8px}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9;animation:fo .2s}
@keyframes fo{from{opacity:0}}
.box{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));animation:sl .3s ease}
@keyframes sl{from{transform:translateY(100%)}}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:2px 20px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;font-size:16px;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// الگ نام والی ایپ: دکاندار والی ایپ اس لاگ اِن کو کبھی بند نہیں کر سکتی
const fb=firebase.initializeApp({
  apiKey:"AIzaSyCFW0RgqKYr4oqPkzXN12Fi3vasAXdVBoA",
  authDomain:"bablu-khata.firebaseapp.com",
  projectId:"bablu-khata",
  storageBucket:"bablu-khata.firebasestorage.app",
  messagingSenderId:"123920071236",
  appId:"1:123920071236:web:636866ce33cb0c7dcdda11"
},'admin');
const auth=fb.auth(),db=fb.firestore(),TS=firebase.firestore.Timestamp;
const ADMIN='admin@bablu.app',DAY=864e5;
let users=[],unsub=null,q='';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms=t=>t&&t.toMillis?t.toMillis():0;
const fmt=t=>{if(!t)return'—';const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function sheet(h){$('#sheet').innerHTML='<div class="ov" onclick="if(event.target==this)shut()"><div class="box">'+h+'</div></div>'}
function shut(){$('#sheet').innerHTML=''}
let cb;
function ask(msg,yes,fn,cls){cb=fn;sheet(`<h2 class="c" style="font-size:20px">${msg}</h2><div class="bt"><button class="b ${cls||'r'}" onclick="shut();cb()">${yes}</button><button class="b l" onclick="shut()">نہیں، رہنے دیں</button></div>`)}

// قفل والا صفحہ
function gate(){
  unsub&&unsub();unsub=null;users=[];
  $('#app').innerHTML=`<div class="gate" id="gt">
  <svg class="lock" viewBox="0 0 120 140" width="128" height="150" aria-hidden="true">
    <g class="sh"><path d="M32 66V44a28 28 0 0 1 56 0v22" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/></g>
    <rect x="14" y="62" width="92" height="70" rx="18" fill="#fbbf24"/>
    <rect x="14" y="62" width="92" height="70" rx="18" fill="none" stroke="#92400e" stroke-width="4"/>
    <circle cx="60" cy="92" r="9" fill="#92400e"/><rect x="56" y="96" width="8" height="18" rx="4" fill="#92400e"/>
  </svg>
  <h1>ایڈمن</h1><p>صرف مالک کے لیے</p>
  <input id="pw" class="pw" type="tel" inputmode="text" autocomplete="current-password" placeholder="پاس ورڈ" onkeydown="if(event.key=='Enter')enter()">
  <div id="er" class="er"></div>
  <button id="go" class="go" onclick="enter()">کھولیں</button></div>`}

async function enter(){
  const p=$('#pw').value,b=$('#go');
  if(!p)return $('#er').textContent='پاس ورڈ لکھیں';
  b.disabled=true;$('#er').textContent='';
  try{await auth.signInWithEmailAndPassword(ADMIN,p);$('#gt').classList.add('open')}
  catch(e){
    b.disabled=false;
    const c=e.code||'';
    $('#er').textContent=/network/.test(c)?'انٹرنیٹ نہیں ہے':/too-many/.test(c)?'بہت کوششیں ہو گئیں، تھوڑی دیر بعد کریں':'پاس ورڈ غلط ہے';
    const g=$('#gt');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}}

// دکانداروں کی فہرست
function latest(){
  const m={};
  users.slice().sort((a,b)=>ms(b.createdAt)-ms(a.createdAt)).forEach(u=>{(m[u.phone]=m[u.phone]||{u:u,n:0}).n++});
  return Object.values(m)}

function dash(){
  $('#app').innerHTML=`<div class="top"><div class="row"><b style="font-size:22px">ایڈمن پینل</b><button class="out" onclick="auth.signOut()">باہر</button></div>
  <div class="st" id="stats"></div></div>
  <div class="wrap"><input id="q" class="q" placeholder="نام یا نمبر ڈھونڈیں" oninput="q=this.value;list()"><div id="ls"></div></div>`;
  unsub=db.collection('users').onSnapshot(s=>{users=s.docs.map(d=>({id:d.id,...d.data()}));list()},e=>toast('اجازت نہیں ہے۔ Rules چیک کریں'))}

function list(){
  const now=Date.now(),t0=new Date().setHours(0,0,0,0),all=latest();
  const open=all.filter(x=>ms(x.u.paidUntil)>now).length;
  $('#stats').innerHTML=`<div>کل<b>${all.length}</b></div><div>کھلے<b>${open}</b></div><div>بند<b>${all.length-open}</b></div><div>آج کے نئے<b>${all.filter(x=>ms(x.u.createdAt)>=t0).length}</b></div>`;
  const k=q.trim().toLowerCase();
  const l=all.filter(x=>!k||String(x.u.name||'').toLowerCase().includes(k)||String(x.u.phone||'').includes(k));
  $('#ls').innerHTML=l.length?l.map((x,i)=>{
    const u=x.u,pu=ms(u.paidUntil),on=pu>now;
    return `<div class="shop${on?'':' off'}" style="--d:${Math.min(i,8)*.04}s">
      <div class="nm">${esc(u.name)}<span class="tag">${on?'کھلا':'بند'}</span></div>
      <a class="ph" href="tel:${esc(u.phone)}">${esc(u.phone)}</a>
      <div class="mu">شامل ہوئے ${fmt(ms(u.createdAt))} — ${on?'باقی '+Math.ceil((pu-now)/DAY)+' دن، ختم '+fmt(pu):'ختم ہوئے '+fmt(pu)}</div>
      <div class="bt">
        <button class="b" onclick="extend('${u.id}')">30 دن بڑھائیں</button>
        ${on?`<button class="b r" onclick="closeIt('${u.id}')">بند کریں</button>`:''}
        ${x.n>1?`<button class="b o" onclick="mig('${esc(u.phone)}')">پرانا ڈیٹا لائیں (${x.n-1})</button>`:''}
      </div></div>`}).join(''):'<div class="empty">'+(all.length?'کوئی نہیں ملا':'ابھی کوئی دکاندار نہیں')+'</div>'}

function find(id){return users.find(u=>u.id==id)}
function extend(id){
  const u=find(id);if(!u)return;
  ask(esc(u.name)+' کا کھاتا 30 دن کے لیے کھولیں؟','ہاں، کھولیں',async()=>{
    const base=Math.max(Date.now(),ms(u.paidUntil));
    try{await db.doc('users/'+id).update({paidUntil:TS.fromMillis(base+30*DAY)});toast('کھاتا 30 دن بڑھ گیا')}catch(e){toast('نہیں ہو سکا')}},'')}
function closeIt(id){
  const u=find(id);if(!u)return;
  ask(esc(u.name)+' کا کھاتا بند کریں؟ پرانا ریکارڈ محفوظ رہے گا۔','ہاں، بند کریں',async()=>{
    try{await db.doc('users/'+id).update({paidUntil:TS.fromMillis(Date.now()-1000)});toast('کھاتا بند ہو گیا')}catch(e){toast('نہیں ہو سکا')}})}

// پن بھول جانے پر: پرانے کھاتوں کا ڈیٹا نئے کھاتے میں لانا
function mig(phone){
  ask('اس نمبر کے پرانے کھاتوں کا سارا ڈیٹا نئے کھاتے میں لائیں؟','ہاں، لائیں',async()=>{
    const l=users.filter(u=>u.phone==phone).sort((a,b)=>ms(a.createdAt)-ms(b.createdAt));
    const to=l[l.length-1],from=l.slice(0,-1);let n=0;
    toast('ڈیٹا آ رہا ہے...');
    try{
      for(const f of from)for(const c of['customers','entries']){
        const s=await db.collection('users/'+f.id+'/'+c).get();
        for(let i=0;i<s.docs.length;i+=400){
          const ch=s.docs.slice(i,i+400),b=db.batch();
          ch.forEach(d=>b.set(db.doc('users/'+to.id+'/'+c+'/'+d.id),d.data()));
          await b.commit();n+=ch.length}}
      await db.doc('users/'+to.id).update({paidUntil:TS.fromMillis(Math.max(...l.map(u=>ms(u.paidUntil))))});
      toast('✅ '+n+' چیزیں منتقل ہو گئیں')
    }catch(e){toast('درمیان میں رک گیا۔ دوبارہ دبائیں')}},'o')}

auth.onAuthStateChanged(u=>{
  if(u&&u.email==ADMIN){setTimeout(dash,$('#gt')?650:0)}
  else{if(u)auth.signOut();gate()}});
</script>
</body>
</html>
