/* واٹس ایپ یاددہانی بٹن */
.wab{display:block;width:100%;margin-top:10px;border:0;border-radius:16px;padding:2px 12px;font-size:18px;line-height:2.2;color:#fff;background:linear-gradient(135deg,#25d366,#128c7e);box-shadow:0 3px 0 #0b6b5e;cursor:pointer;transition:transform .08s,box-shadow .08s}

@keyframes wv{50%{height:46px}}
#mc .ov{z-index:40}
.wv{display:flex;justify-content:center;align-items:center;gap:7px;height:52px}
.wv i{width:9px;height:12px;border-radius:6px;background:linear-gradient(#14b8a6,#0f766e);animation:wv 1s ease-in-out infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}.wv i:nth-child(5){animation-delay:.6s}

</style>

<body>
<div id="app"></div>

<div id="mc"></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyCFW0RgqKYr4oqPkzXN12Fi3vasAXdVBoA",authDomain:"bablu-khata.firebaseapp.com",projectId:"bablu-khata",storageBucket:"bablu-khata.firebasestorage.app",messagingSenderId:"123920071236",appId:"1:123920071236:web:636866ce33cb0c7dcdda11"};
firebase.initializeApp(CFG);
const AA=firebase.initializeApp(CFG,'adm'); // ایڈمن کا الگ سیشن
const auth=firebase.auth(),aauth=AA.auth(),db=firebase.firestore(),adb=AA.firestore(),FV=firebase.firestore.FieldValue,TSP=firebase.firestore.Timestamp;
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

const ADMIN='admin@bablu.app',DAY=864e5,PAY_NUM='03012207137',WA_NUM='03480329691',APP_NAME='ڈیجیٹل روزگار',ALERT_DAYS=15;
const ADM=location.hash=='#admin';
let uid,me,custs=[],ents=[],sales=[],users=[],unsubs=[],view={n:'list'},q='',authMode='login',cb,showFee=false,first=true,deferredInstall=null;
let base=JSON.parse(localStorage.getItem('bt')||'null');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('installBtn');if(b)b.style.display='block'});
addEventListener('appinstalled',()=>{deferredInstall=null});

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const en=s=>String(s||'').replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
const num=n=>Math.round(n).toLocaleString('en-US');
const tm12=t=>{const d=new Date(t);let h=d.getHours();const m=String(d.getMinutes()).padStart(2,'0'),p=h<4?'رات':h<12?'صبح':h<16?'دوپہر':h<20?'شام':'رات';return (h%12||12)+':'+m+' '+p};
const fmt=t=>{if(!t)return'';const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
const mail=(p,v)=>p+(v>1?'v'+v:'')+'@bablu.app';
const focus=id=>setTimeout(()=>{const e=$('#'+id);e&&e.focus()},350);
const daysDiff=ts=>Math.floor((Date.now()-ts)/DAY);
const sum=a=>a.reduce((s,e)=>s+e.amt,0);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
function sheet(h){$('#sheet').innerHTML='<div class="ov" onclick="if(event.target==this)closeSheet()"><div class="box">'+h+'</div></div>'}
function closeSheet(){$('#sheet').innerHTML=''}
function ask(msg,yes,fn,cls){cb=fn;sheet(`<h2 class="c">${msg}</h2><button class="btn ${cls||'red'}" onclick="closeSheet();cb()">${yes}</button><button class="btn lite" onclick="closeSheet()">❌ نہیں، رہنے دیں</button>`)}
function er(m){const e=$('#er');if(e)e.textContent=m}
function busy(b){const g=$('#go');if(g)g.classList.toggle('busy',!!b)}
function em(e){const c=e.code||'';
  if(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(c))return 'پن غلط ہے';
  if(/network|unavailable/.test(c))return 'انٹرنیٹ نہیں ہے';
  if(c.includes('too-many'))return 'بہت کوششیں ہو گئیں۔ تھوڑی دیر بعد کریں';
  if(c.includes('permission'))return 'اجازت نہیں ہے';
  return 'کچھ گڑبڑ ہو گئی'}
function footerHTML(){return `<div class="footer"><b>📒 ${APP_NAME}</b><br>واٹس ایپ: <a href="https://wa.me/92${WA_NUM.slice(1)}">${WA_NUM}</a><br><small>آپ کا ڈیجیٹل حساب کتاب</small><br><button class="lnk snd" onclick="speak(GREET)">🔊 السلام علیکم</button>${deferredInstall?'<button class="lnk" onclick="installApp()">📲 ایپ ہوم اسکرین پر لگائیں</button>':''}</div>`}
async function installApp(){
  if(!deferredInstall)return toast('ایپ پہلے سے انسٹال ہے یا انسٹال نہیں ہو سکتی');
  deferredInstall.prompt();const r=await deferredInstall.userChoice;
  if(r.outcome==='accepted')toast('✅ ایپ انسٹال ہو گئی!');deferredInstall=null}

// ===== فوری ردعمل: دباتے وقت صفحہ دوبارہ نہ بنے (ورنہ کلک ضائع ہو جاتی ہے) =====
let pressing=false,pT=0;
addEventListener('pointerdown',()=>{pressing=true;clearTimeout(pT);pT=setTimeout(()=>{pressing=false},1500)},true);
const relPress=()=>{clearTimeout(pT);pT=setTimeout(()=>{pressing=false},80)};
addEventListener('pointerup',relPress,true);
addEventListener('pointercancel',relPress,true);

// ===== ٹک کی آواز: ہر بٹن دبانے پر (انٹرنیٹ کے بغیر بھی چلتی ہے) + ہلکی تھرتھراہٹ =====
let AC=null;
function tick(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state=='suspended')AC.resume();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    // نرم، ہلکی "ٹپ" جیسی میٹھی آواز
    o.type='sine';
    o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1050,t+.05);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.13);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.14)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
// آواز صرف مائک اور اسپیکر والے بٹنوں پر؛ باقی بٹن بغیر آواز کے صرف دبتے نظر آتے ہیں
const CLK='.mic,.spk,.snd';
addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest(CLK);if(t&&!t.classList.contains('busy'))tick()},true);

// ===== آواز: فون کی اردو آواز (آف لائن بھی چلتی ہے)، پہلی کلک پر چلے =====
const urV=()=>window.speechSynthesis?speechSynthesis.getVoices().filter(x=>/^ur/i.test(x.lang)):[];
if(window.speechSynthesis){try{speechSynthesis.getVoices()}catch(e){}speechSynthesis.onvoiceschanged=()=>{}}
let ttsUnlocked=false;
function unlockTTS(){
  if(ttsUnlocked||!window.speechSynthesis)return;ttsUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
addEventListener('pointerdown',unlockTTS,{once:true,capture:true});
// ہمیشہ آواز نمبر 2 (اگر نہ ہو تو پہلی)۔ انٹرنیٹ نہ ہو اور وہ آواز آن لائن والی ہو تو فون میں محفوظ آواز چلے
function getVo(){
  const l=urV();if(!l.length)return null;
  const v=l[1]||l[0];
  if(!navigator.onLine&&!v.localService)return l.find(x=>x.localService)||v;

  const out=ctx.createImageData(W,H),od=out.data;
  for(y=1;y<H-1;y++){for(x=1;x<W-1;x++){p=y*W+x;const a=md[p*4+3];if(a===0)continue;
    const gx=(h[p+1]-h[p-1])*0.5,gy=(h[p+W]-h[p-W])*0.5;let nx=-gx,ny=gy,nz=1;const nl=Math.sqrt(nx*nx+ny*ny+1);
    nx/=nl;ny/=nl;nz/=nl;

    const dot=Math.max(0,nx*lx+ny*ly+nz*lz),dot2=Math.max(0,-nx*0.5+ny*0.5+nz*0.7);

function balMap(){const m={};ents.forEach(e=>{if(!e.del)m[e.cid]=(m[e.cid]||0)+(e.type=='d'?e.amt:-e.amt)});return m}
function acc(cid){
  const es=ents.filter(e=>e.cid==cid&&!e.del),D=es.filter(e=>e.type=='d'),L=es.filter(e=>e.type=='l');
  const td=sum(D),tl=sum(L);
  let b=0,st=0;es.slice().sort((x,y)=>x.ts-y.ts).forEach(e=>{if(e.type=='d'){if(b<=0)st=e.ts;b+=e.amt}else b-=e.amt});
  return{td,tl,b:td-tl,first:D.length?Math.min(...D.map(e=>e.ts)):0,lastL:L.length?Math.max(...L.map(e=>e.ts)):0,start:td-tl>0?st:0}}

  </div>${footerHTML()}</div>`;adminAnim=false}
function tog(id,op){ask(op?'یہ کھاتہ 30 دن کے لیے کھولیں؟':'یہ کھاتہ بند کریں؟',op?'🟢 ہاں، کھولیں':'🔴 ہاں، بند کریں',()=>adb.doc('users/'+id).update({paidUntil:TSP.fromMillis(op?Date.now()+30*DAY:Date.now()-1000)}),op?'grn':'red')}

// شروع
function userStart(u){
  uid=u.uid;custs=[];ents=[];sales=[];view={n:'list'};q='';first=true;me=null;renderNow(false);const P='users/'+uid;
  unsubs=[db.doc(P).onSnapshot(s=>{me=s.data()||null;render(first&&!!me);if(me){if(first)setTimeout(greetOnce,1000);first=false}}),
  db.collection(P+'/customers').onSnapshot(s=>{custs=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)}),
  db.collection(P+'/entries').onSnapshot(s=>{ents=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)}),
  db.collection(P+'/sales').onSnapshot(s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)},()=>{})];
  sync();setTimeout(purge,6000)}

if(ADM){
  aauth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];closeSheet();adminAnim=true;
    if(u&&u.email==ADMIN)adminStart();else $('#app').innerHTML=adminLoginHTML()})
}else{
  auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];me=null;uid=null;clearTimeout(rq);rq=0;closeSheet();closeCalc();
    if(u&&u.email==ADMIN){auth.signOut();return}
    if(!u){authMode='login';$('#app').innerHTML=authHTML();if(deferredInstall){const b=$('#installBtn');if(b)b.style.display='block'}return}
    userStart(u)});
  setInterval(()=>{if(me&&uid&&expired()!=showFee)render(false)},30000)}
addEventListener('hashchange',()=>location.reload());
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window._rl){window._rl=1;location.reload()}});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
<!-- ===== ڈیجیٹل روزگار: پیچ بلاک =====
اسے اپنی فائل میں آخری </script> کے بعد اور </body> سے پہلے پیسٹ کریں۔ اپنا باقی کوڈ مت چھیڑیں۔ -->
<style>
/* کچھ فونز فونٹ خود بڑا چھوٹا کر دیتے ہیں، اس سے ڈیزائن ہر فون پر ایک جیسا رہتا ہے */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
</style>
<script>
(function(){
/* 1) فون کی "اینیمیشن کم کرو" سیٹنگ سے ایپ کی اینیمیشن (سکہ، مائک کی لہریں، دھڑکن) تیز نہ ہوں:
      یہ پرانی لائن @media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}} کو ہٹا دیتا ہے */
try{
  Array.prototype.forEach.call(document.styleSheets,function(s){
    try{
      for(var i=s.cssRules.length-1;i>=0;i--){
        var r=s.cssRules[i];
        if(r.media&&/prefers-reduced-motion/.test(r.media.mediaText))s.deleteRule(i);
      }
    }catch(e){}
  });
}catch(e){}

/* 2) مائک کی اجازت کی ہدایت: ایپ کی حالت دیکھ کر صحیح قدم دکھائے، اور نیچے کھلا فارم بند نہ ہو */
var UA=navigator.userAgent||'';
var STANDALONE=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
var INAPP=/FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|; wv\)/.test(UA);
var LT=function(t){return '<span dir="ltr">'+t+'</span>'};

window.permSheet=function(fn,why){
  pend=fn;
  var st;
  if(INAPP){
    st=['اوپر ⋮ (تین نقطے) دبائیں','"Chrome میں کھولیں" چنیں','وہاں مائک 🎤 دبائیں اور '+LT('Allow')+' کریں'];
  }else if(why=='google'){
    st=['فون کی '+LT('Settings')+' ← '+LT('Apps')+' ← '+LT('Permissions')+' ← '+LT('Microphone'),LT('Google')+' (یا '+LT('Google Go')+') کو '+LT('Allow')+' کریں','واپس آ کر "دوبارہ کوشش" دبائیں'];
  }else if(STANDALONE){
    st=['فون کی '+LT('Settings')+' ← '+LT('Apps')+' ← '+LT('Permissions')+' ← '+LT('Microphone'),LT('Chrome')+' کو '+LT('Allow only while using the app')+' کریں',LT('Google')+' (یا '+LT('Google Go')+') کو بھی '+LT('Allow')+' کریں','یہاں واپس آ کر "دوبارہ کوشش" دبائیں'];
  }else{
    st=['اوپر ایڈریس کے ساتھ 🔒 دبائیں',LT('Permissions')+' کھولیں اور '+LT('Reset permissions')+' دبائیں','صفحہ دوبارہ کھولیں، مائک دبائیں اور '+LT('Allow')+' دبائیں','پھر بھی نہ آئے تو '+LT('Settings')+' ← '+LT('Apps')+' ← '+LT('Permissions')+' ← '+LT('Microphone')+' ← '+LT('Chrome')+' ← '+LT('Allow')];
  }
  var nums=['1️⃣','2️⃣','3️⃣','4️⃣'];
  $('#mc').innerHTML='<div class="ov"><div class="box"><h2 class="c">🎤 مائک کی اجازت چاہیے</h2>'
    +'<div class="steps">'+st.map(function(t,i){return '<div>'+nums[i]+' '+t+'</div>'}).join('')+'</div>'
    +'<button class="btn grn" onclick="allowMic()">✅ دوبارہ کوشش</button>'
    +(why=='google'?'<a class="btn" style="text-align:center" href="intent:#Intent;package=com.google.android.apps.searchlite;end">🔎 '+LT('Google Go')+' کھولیں</a>':'')
    +'<button class="btn org" onclick="kbMic()">⌨️ کی بورڈ کے 🎤 سے بول کر لکھیں</button>'
    +'<button class="btn lite" onclick="hideMic()">❌ بند کریں</button></div></div>';
};

/* دوبارہ کوشش: صرف مائک والی ہدایت بند ہو، نیچے کھلا ادھار/فروخت کا فارم بند نہ ہو */
window.allowMic=async function(){
  try{
    var s=await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(function(t){t.stop()});
    hideMic();
    if(pend)mic(null,pend);
  }catch(e){toast('اجازت ابھی بند ہے، اوپر والے قدم دوبارہ دیکھیں')}
};

/* مائک بند ہو تب بھی کام نہ رکے: کی بورڈ کا اپنا مائک (اس کی اجازت ویب سائٹ سے الگ ہے) */
window.kbMic=function(){
  hideMic();
  setTimeout(function(){
    var i=document.querySelector('#sheet input')||document.querySelector('#srch');
    if(i){i.focus();toast('کی بورڈ کا 🎤 دبا کر بولیں')}
  },150);
};
})();
</script>
<script>
/* ===== فون کا بیک بٹن: پہلے صرف کھلی اسکرین/فارم بند ہو، ایپ تب ہی بند ہو جب کچھ کھلا نہ ہو ===== */
(function(){
  function openWhat(){
    if(($('#mc').innerHTML||'').trim())return 'mic';
    if(($('#calc').innerHTML||'').trim())return 'calc';
    if(($('#sheet').innerHTML||'').trim())return 'sheet';
    if(!ADM&&uid&&view&&view.n!='list')return 'view';
    if(!ADM&&!uid&&authMode!='login')return 'auth';
    return '';
  }
  function arm(){
    try{if(!history.state||history.state.g!==1)history.pushState({g:1},'')}catch(e){}
  }
  try{history.replaceState({g:0},'')}catch(e){}
  /* ہر ٹچ پر چیک: بیک کے لیے ایک "پہرے دار" انٹری ہمیشہ موجود رہے */
  addEventListener('pointerdown',arm,true);
  addEventListener('popstate',function(){
    var o=openWhat();
    if(!o){history.back();return}
    if(o=='mic')cancelMic();
    else if(o=='calc')closeCalc();
    else if(o=='sheet')closeSheet();
    else if(o=='view')go({n:'list'});
    else setMode('login');
    arm();
  });
})();
</script>
