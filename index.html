<style>

.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0;direction:ltr}
.kp button{border:0;border-radius:14px;background:#e2e8f0;font-size:24px;padding:2px 0;line-height:1.9;color:#1f2937;box-shadow:0 3px 0 #cbd5e1;transition:transform .1s;cursor:pointer}
.kp button:active{transform:scale(.92)}
.kp .op{background:#ccfbf1;color:#0f766e}
.kp .cl{background:#fee2e2;color:#b91c1c}
.kp .eq{background:#0f766e;color:#fff}
.kp .w2{grid-column:span 2}
.btn.org{background:#ea580c;box-shadow:0 4px 0 #c2410c}
@keyframes wv{50%{height:46px}}
#mc .ov{z-index:40}
.wv{display:flex;justify-content:center;align-items:center;gap:7px;height:52px}
.wv i{width:9px;height:12px;border-radius:6px;background:linear-gradient(#14b8a6,#0f766e);animation:wv 1s ease-in-out infinite}
.wv i:nth-child(2){animation-delay:.15s}.wv i:nth-child(3){animation-delay:.3s}.wv i:nth-child(4){animation-delay:.45s}.wv i:nth-child(5){animation-delay:.6s}
.mt{font-size:32px;line-height:2.4;min-height:90px;color:#0f766e;padding:4px 6px;word-break:break-word}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
const CFG={apiKey:"AIzaSyCFW0RgqKYr4oqPkzXN12Fi3vasAXdVBoA",authDomain:"bablu-khata.firebaseapp.com",projectId:"bablu-khata",storageBucket:"bablu-khata.firebasestorage.app",messagingSenderId:"123920071236",appId:"1:123920071236:web:636866ce33cb0c7dcdda11"};
firebase.initializeApp(CFG);
const AA=firebase.initializeApp(CFG,'adm'); // ایڈمن کا الگ سیشن
const auth=firebase.auth(),aauth=AA.auth(),db=firebase.firestore(),adb=AA.firestore(),FV=firebase.firestore.FieldValue,TSP=firebase.firestore.Timestamp;
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

const ADMIN='admin@bablu.app',DAY=864e5,PAY_NUM='03012207137',WA_NUM='03480329691',APP_NAME='ببلو کھاتا',ALERT_DAYS=15;
const ADM=location.hash=='#admin';
let uid,me,custs=[],ents=[],sales=[],users=[],unsubs=[],view={n:'list'},q='',authMode='login',cb,showFee=false,first=true,deferredInstall=null;
let base=JSON.parse(localStorage.getItem('bt')||'null');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;const b=document.getElementById('installBtn');if(b)b.style.display='block'});
addEventListener('appinstalled',()=>{deferredInstall=null});

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const en=s=>String(s||'').replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
const num=n=>Math.round(n).toLocaleString('en-US');
const fmt=t=>{if(!t)return'';const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
const mail=(p,v)=>p+(v>1?'v'+v:'')+'@bablu.app';
const focus=id=>setTimeout(()=>{const e=$('#'+id);e&&e.focus()},350);
const daysDiff=ts=>Math.floor((Date.now()-ts)/DAY);
const sum=a=>a.reduce((s,e)=>s+e.amt,0);

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
function sheet(h){$('#sheet').innerHTML='<div class="ov" onclick="if(event.target==this)closeSheet()"><div class="box">'+h+'</div></div>'}
function closeSheet(){$('#sheet').innerHTML=''}
function ask(msg,yes,fn,cls){cb=fn;sheet(`<h2 class="c">${msg}</h2><button class="btn ${cls||'red'}" onclick="closeSheet();cb()">${yes}</button><button class="btn lite" onclick="closeSheet()">❌ نہیں، رہنے دیں</button>`)}
function er(m){const e=$('#er');if(e)e.textContent=m}
function busy(b){const g=$('#go');if(g)g.classList.toggle('busy',!!b)}
function em(e){const c=e.code||'';
  if(/wrong-password|invalid-credential|invalid-login|user-not-found/.test(c))return 'پن غلط ہے';
  if(/network|unavailable/.test(c))return 'انٹرنیٹ نہیں ہے';
  if(c.includes('too-many'))return 'بہت کوششیں ہو گئیں۔ تھوڑی دیر بعد کریں';
  if(c.includes('permission'))return 'اجازت نہیں ہے';
  return 'کچھ گڑبڑ ہو گئی'}
function footerHTML(){return `<div class="footer"><b>📒 ${APP_NAME}</b><br>واٹس ایپ: <a href="https://wa.me/92${WA_NUM.slice(1)}">${WA_NUM}</a><br><small>آپ کا ڈیجیٹل حساب کتاب</small><br><button class="lnk" onclick="nextVoice()">🔈 آواز بدلیں</button>${deferredInstall?'<button class="lnk" onclick="installApp()">📲 ایپ ہوم اسکرین پر لگائیں</button>':''}</div>`}
async function installApp(){
  if(!deferredInstall)return toast('ایپ پہلے سے انسٹال ہے یا انسٹال نہیں ہو سکتی');
  deferredInstall.prompt();const r=await deferredInstall.userChoice;
  if(r.outcome==='accepted')toast('✅ ایپ انسٹال ہو گئی!');deferredInstall=null}

// آواز: فون کی اردو آواز (آف لائن بھی چلتی ہے)، پسند کی آواز یاد رکھتی ہے
const urV=()=>window.speechSynthesis?speechSynthesis.getVoices().filter(x=>/^ur/i.test(x.lang)):[];
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
function getVo(){const l=urV(),n=localStorage.getItem('vo');return l.find(x=>x.voiceURI==n)||l.find(x=>x.localService)||l[0]||null}
function noVoice(){sheet(`<h2 class="c">🔈 اردو آواز نہیں ملی</h2><p class="c">فون Settings ← Google Text-to-speech (یا Speech Services) ← Install voice data ← اردو (پاکستان) ڈاؤن لوڈ کریں۔ ایک بار ڈاؤن لوڈ ہو جائے تو انٹرنیٹ کے بغیر بھی بولے گا۔</p><button class="btn" onclick="closeSheet()">✅ ٹھیک ہے</button>`)}
const UW='زیرو ایک دو تین چار پانچ چھ سات آٹھ نو دس گیارہ بارہ تیرہ چودہ پندرہ سولہ سترہ اٹھارہ انیس بیس اکیس بائیس تئیس چوبیس پچیس چھبیس ستائیس اٹھائیس انتیس تیس اکتیس بتیس تینتیس چونتیس پینتیس چھتیس سینتیس اڑتیس انتالیس چالیس اکتالیس بیالیس تینتالیس چوالیس پینتالیس چھیالیس سینتالیس اڑتالیس انچاس پچاس اکاون باون ترپن چون پچپن چھپن ستاون اٹھاون انسٹھ ساٹھ اکسٹھ باسٹھ تریسٹھ چونسٹھ پینسٹھ چھیاسٹھ سڑسٹھ اڑسٹھ انہتر ستر اکہتر بہتر تہتر چوہتر پچھتر چھہتر ستتر اٹھہتر انیاسی اسی اکیاسی بیاسی تراسی چوراسی پچاسی چھیاسی ستاسی اٹھاسی نواسی نوے اکیانوے بانوے ترانوے چورانوے پچانوے چھیانوے ستانوے اٹھانوے ننانوے'.split(' ');
// 1300 = "ایک ہزار، تین سو" (ہر حصے کے بیچ وقفہ تاکہ آواز "ہزار" نہ چھوڑے)
function words(n){n=Math.round(Math.abs(n));if(n<100)return UW[n];const p=[],cr=Math.floor(n/1e7),lk=Math.floor(n%1e7/1e5),hz=Math.floor(n%1e5/1e3),sa=Math.floor(n%1e3/100),r=n%100;
  if(cr)p.push(words(cr)+' کروڑ');if(lk)p.push(UW[lk]+' لاکھ');if(hz)p.push(UW[hz]+' ہزار');if(sa)p.push(UW[sa]+' سو');if(r)p.push(UW[r]);return p.join('، ')}
const say=t=>String(t).replace(/\d[\d,]*/g,m=>words(m.replace(/,/g,'')));
// بولی ہوئی اردو رقم ("ایک ہزار تین سو") کو عدد بناتا ہے
function w2n(t){let tot=0,cur=0,ok=0;
  for(const w of String(t).replace(/[،,.۔]/g,' ').split(/\s+/)){const i=UW.indexOf(w);
    if(i>=0){cur+=i;ok=1}
    else if(w=='سو'){cur=(cur||1)*100;ok=1}
    else if(w=='ہزار'){tot+=(cur||1)*1e3;cur=0;ok=1}
    else if(w=='لاکھ'){tot+=(cur||1)*1e5;cur=0;ok=1}
    else if(w=='کروڑ'){tot+=(cur||1)*1e7;cur=0;ok=1}}
  return ok?tot+cur:0}
function speak(t){
  if(!window.speechSynthesis)return toast('یہ فون آواز نہیں دے سکتا');
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(say(t)),v=getVo();
  u.lang=v?v.lang:'ur-PK';if(v)u.voice=v;u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u)}
function nextVoice(){
  const l=urV();if(!l.length)return noVoice();
  const i=(l.findIndex(x=>x===getVo())+1)%l.length;localStorage.setItem('vo',l[i].voiceURI);
  toast('آواز '+(i+1)+' / '+l.length);speak('السلام علیکم، اللہ کے نام سے شروع کریں')}

// مائک: پہلی بار خود اجازت مانگتا ہے، ایک کلک پر شروع ہوتا ہے
let rec=null,micT=0,micLock=0;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function showMic(t){if(!$('#mt'))$('#mc').innerHTML=`<div class="ov"><div class="box c"><div class="wv"><i></i><i></i><i></i><i></i><i></i></div><h2>🎤 بولیں</h2><div id="mt" class="mt"></div><button class="btn grn" onclick="stopMic()">✅ بول لیا</button><button class="btn lite" onclick="cancelMic()">❌ بند کریں</button></div></div>`;$('#mt').textContent=t||'سن رہا ہوں...'}
function hideMic(){$('#mc').innerHTML=''}
function stopMic(){const r=rec;if(!r)return;try{r.stop()}catch(x){}setTimeout(()=>{if(rec===r)cancelMic()},2500)}
function cancelMic(){const r=rec;rec=null;if(r)try{r.abort()}catch(x){}hideMic();document.querySelectorAll('.mic.on').forEach(b=>b.classList.remove('on'))}
let pend=null,waitBack=false;
function permSheet(fn,why){pend=fn;const g=why=='google';
  sheet(`<h2 class="c">🎤 اجازت چاہیے</h2><p class="c">${g?'فون کی گوگل آواز والی ایپ کو مائک کی اجازت دینی ہے۔ نیچے Google Go کھولیں، وہاں مائک دبائیں، "While using the app" دبائیں اور واپس آ جائیں۔':'اوپر 🔒 دبائیں ← Permissions ← Microphone ← Allow۔ پھر نیچے "دوبارہ کوشش" دبائیں۔'}</p><button class="btn grn" onclick="allowMic()">✅ دوبارہ کوشش</button>${g?'<a class="btn" style="text-align:center" href="intent:#Intent;package=com.google.android.apps.searchlite;end" onclick="waitBack=true">🔎 Google Go کھولیں</a>':''}<button class="btn lite" onclick="closeSheet()">❌ بند کریں</button>`)}
// اجازت کی حالت: ملی ہو تو سیدھا چلے، ورنہ Chrome کا "Allow" پاپ اپ خود آئے
async function micOK(){
  try{if(navigator.permissions){const p=await navigator.permissions.query({name:'microphone'});if(p.state=='granted')return 1;if(p.state=='denied')return 0}}catch(e){}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());return 1}catch(e){return 0}}
async function allowMic(){
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());closeSheet();if(pend)mic(null,pend)}
  catch(e){toast('اجازت نہیں ملی')}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&waitBack){waitBack=false;closeSheet();if(pend)setTimeout(()=>mic(null,pend),400)}});
async function mic(btn,fn){
  if(!SR)return toast('اس براؤزر میں مائک نہیں چلتا');
  if(rec){if(Date.now()-micT>800)stopMic();return}
  if(micLock)return;
  if(!navigator.onLine)return toast('مائک کے لیے انٹرنیٹ چاہیے۔ ٹائپ کر لیں');
  micLock=1;
  try{
    if(window.speechSynthesis&&speechSynthesis.speaking){speechSynthesis.cancel();await new Promise(r=>setTimeout(r,250))}
    if(!await micOK())return permSheet(fn,'blocked');
    listen(btn,fn,0)}
  finally{micLock=0}}
function listen(btn,fn,tried){
  const r=new SR();r.lang='ur-PK';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;rec=r;micT=Date.now();let txt='';
  const wd=setTimeout(()=>{if(rec===r)cancelMic()},20000);
  const fin=()=>{clearTimeout(wd);if(btn)btn.classList.remove('on')};
  r.onresult=e=>{txt='';for(const x of e.results)txt+=x[0].transcript;showMic(txt)};
  r.onend=()=>{fin();if(rec!==r)return;rec=null;hideMic();if(txt.trim())fn(txt.trim());else toast('آواز نہیں آئی، دوبارہ دبائیں')};
  r.onerror=async e=>{if(rec!==r)return;fin();rec=null;hideMic();const c=e.error;
    if(c=='aborted')return;
    if(c=='not-allowed'&&!tried){if(await micOK())return listen(btn,fn,1)}
    if(c=='not-allowed')return permSheet(fn,'blocked');
    if(c=='service-not-allowed')return permSheet(fn,'google');
    toast(c=='network'?'مائک کو انٹرنیٹ چاہیے':c=='no-speech'?'آواز نہیں آئی، دوبارہ دبائیں':'آواز سمجھ نہیں آئی')};
  if(btn)btn.classList.add('on');showMic('');
  try{r.start()}catch(x){fin();rec=null;hideMic();toast('دوبارہ دبائیں')}}
function fill(id,t,numeric){

  else i.value+=(i.value?' ':'')+t.replace(/[.۔]+$/,'')}
function searchSet(t){if(/آج/.test(t)&&/بیچ|رپورٹ|سودا|چیز|فروخت|بچت/.test(t))return report();q=t.replace(/[.۔]+$/,'');const i=$('#srch');if(i)i.value=q;const l=$('#cl');if(l)l.innerHTML=cl_html()}

// کیلکولیٹر
let cx='';
const KEYS=[['C','cl'],['⌫','op'],['÷','op'],['×','op'],['7'],['8'],['9'],['−','op'],['4'],['5'],['6'],['+','op'],['1'],['2'],['3'],['=','eq'],['0','w2'],['00'],['.']];
function calc(){cx='';$('#calc').innerHTML=`<div class="ov" onclick="if(event.target==this)closeCalc()"><div class="box"><h2 class="c">🧮 کیلکولیٹر</h2><div class="cd" id="cd">0</div><div class="kp">${KEYS.map(k=>`<button class="${k[1]||''}" onclick="key('${k[0]}')">${k[0]}</button>`).join('')}</div><button class="btn grn" onclick="useCalc()">✅ رقم میں ڈالیں</button><button class="btn lite" onclick="closeCalc()">❌ بند کریں</button></div></div>`}
function closeCalc(){$('#calc').innerHTML=''}
function cshow(){$('#cd').textContent=cx||'0'}
function cval(){
  const s=cx.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[+\-*/.]+$/,'');
  if(!s||!/^[\d+\-*/. ]+$/.test(s))return null;
  try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?Math.round(v*100)/100:null}catch(e){return null}}
function key(k){const ops='+−×÷';
  if(k=='C')cx='';else if(k=='⌫')cx=cx.slice(0,-1);
  else if(k=='='){const v=cval();if(v!==null)cx=String(v)}
  else if(ops.includes(k)){if(!cx)return;if(ops.includes(cx.slice(-1)))cx=cx.slice(0,-1);cx+=k}
  else if(k=='00'){if(!cx||ops.includes(cx.slice(-1)))return;cx+='00'}
  else cx+=k;cshow()}
function useCalc(){const v=cval();if(v===null||v<=0)return toast('پہلے حساب لگائیں');const i=$('#am');if(i)i.value=Math.round(v);closeCalc();toast('✅ رقم ڈال دی')}

// حساب
function balMap(){const m={};ents.forEach(e=>{if(!e.del)m[e.cid]=(m[e.cid]||0)+(e.type=='d'?e.amt:-e.amt)});return m}
function acc(cid){
  const es=ents.filter(e=>e.cid==cid&&!e.del),D=es.filter(e=>e.type=='d'),L=es.filter(e=>e.type=='l');
  const td=sum(D),tl=sum(L);
  let b=0,st=0;es.slice().sort((x,y)=>x.ts-y.ts).forEach(e=>{if(e.type=='d'){if(b<=0)st=e.ts;b+=e.amt}else b-=e.amt});
  return{td,tl,b:td-tl,first:D.length?Math.min(...D.map(e=>e.ts)):0,lastL:L.length?Math.max(...L.map(e=>e.ts)):0,start:td-tl>0?st:0}}
function go(v){view=v;closeSheet();render(true);scrollTo(0,0)}
function counts(){document.querySelectorAll('.amt[data-v],.bx b[data-v]').forEach(el=>{
  const v=+el.dataset.v;if(!v)return;const t0=performance.now();
  (function f(t){const p=Math.min((t-t0)/550,1);el.textContent=num(v*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}

function morning(){

// صرف 30 دن پرانے ڈیلیٹ شدہ صاف ہوتے ہیں، عام ڈیٹا ہمیشہ رہتا ہے
function purge(){
  const n=Date.now(),P='users/'+uid,b=db.batch();let c=0;
  ents.forEach(e=>{if(c<400&&e.del&&e.delAt&&n-e.delAt>30*DAY){b.delete(db.doc(P+'/entries/'+e.id));c++}});
  sales.forEach(s=>{if(c<400&&s.del&&s.delAt&&n-s.delAt>30*DAY){b.delete(db.doc(P+'/sales/'+s.id));c++}});
  custs.forEach(x=>{if(c<400&&x.del&&x.delAt&&n-x.delAt>30*DAY){b.delete(db.doc(P+'/customers/'+x.id));c++;ents.filter(e=>e.cid==x.id).forEach(e=>{if(c<450){b.delete(db.doc(P+'/entries/'+e.id));c++}})}});
  if(c)b.commit().catch(()=>{})}

  sheet(`<h2 class="c">🔑 ${esc(u.name)} کا نیا پن</h2><input id="np" class="in" type="tel" inputmode="numeric" maxlength="6" placeholder="نیا پن (6 ہندسے)"><div id="er" class="er"></div><button id="go" class="btn org" onclick="doReset('${id}')">✅ پن بدلیں</button><button class="btn lite" onclick="closeSheet()">❌ بند کریں</button>`);focus('np')}
async function doReset(id){
  const u=users.find(x=>x.id==id),pin=en($('#np').value||'').trim();
  if(!/^\d{6}$/.test(pin))return er('پن 6 ہندسوں کا لکھیں');
  busy(1);er('');
  try{
    const pd=await adb.doc('phones/'+u.phone).get(),ver=(pd.exists?pd.data().v:1)+1;
    const old=await Promise.all(['customers','entries','sales'].map(k=>adb.collection('users/'+id+'/'+k).get()));
    const RA=firebase.initializeApp(CFG,'r'+Date.now()),ra=RA.auth(),rd=RA.firestore();
    const c=await ra.createUserWithEmailAndPassword(mail(u.phone,ver),pin),nu=c.user.uid;
    await rd.doc('users/'+nu).set({name:u.name,phone:u.phone,createdAt:TSP.fromMillis((u.createdAt?u.createdAt.toMillis():Date.now())+1),paidUntil:u.paidUntil||TSP.fromMillis(Date.now()+30*DAY),lastSeen:FV.serverTimestamp()});
    const docs=[];old[0].forEach(d=>docs.push(['customers',d]));old[1].forEach(d=>docs.push(['entries',d]));old[2].forEach(d=>docs.push(['sales',d]));
    for(let i=0;i<docs.length;i+=400){const b=rd.batch();docs.slice(i,i+400).forEach(([k,d])=>b.set(rd.doc('users/'+nu+'/'+k+'/'+d.id),d.data()));await b.commit()}
    await rd.doc('phones/'+u.phone).set({v:ver,uid:nu});
    await ra.signOut();RA.delete().catch(()=>{});
    closeSheet();toast('✅ نیا پن: '+pin+' (دکاندار کو بتا دیں)')
  }catch(e){busy(0);er((e.code||'').includes('permission')?'Firebase Rules میں ایڈمن کو اجازت دیں':em(e))}}
let adminAnim=true;
function adminRender(){

  <button class="btn ${ex(u)?'grn':'red'}" onclick="tog('${u.id}',${ex(u)})">${ex(u)?'🟢 کھاتہ کھولیں (30 دن)':'🔴 کھاتہ بند کریں'}</button><button class="btn org" onclick="resetPin('${u.id}')">🔑 پن ری سیٹ</button></div>`).join('')||'<div class="empty">ابھی کوئی دکاندار نہیں</div>'}
  </div>${footerHTML()}</div>`;adminAnim=false}

  uid=u.uid;custs=[];ents=[];sales=[];view={n:'list'};q='';first=true;me=null;render();const P='users/'+uid;
  unsubs=[db.doc(P).onSnapshot(s=>{me=s.data()||null;render(first&&!!me);if(me)first=false}),
  db.collection(P+'/customers').onSnapshot(s=>{custs=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)}),
  db.collection(P+'/entries').onSnapshot(s=>{ents=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)}),
  db.collection(P+'/sales').onSnapshot(s=>{sales=s.docs.map(d=>({id:d.id,...d.data()}));if(me)render(false)},()=>{})];
  sync();setTimeout(purge,6000)}

if(ADM){
  aauth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];closeSheet();adminAnim=true;
    if(u&&u.email==ADMIN)adminStart();else $('#app').innerHTML=adminLoginHTML()})
}else{
  auth.onAuthStateChanged(u=>{unsubs.forEach(f=>f());unsubs=[];me=null;uid=null;closeSheet();closeCalc();
    if(u&&u.email==ADMIN){auth.signOut();return}
    if(!u){authMode='login';$('#app').innerHTML=authHTML();if(deferredInstall){const b=$('#installBtn');if(b)b.style.display='block'}return}
    userStart(u)});
  setInterval(()=>{if(me&&uid&&expired()!=showFee)render(false)},30000)}
addEventListener('hashchange',()=>location.reload());
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
